services:
  - type: web
    name: gestion-locative
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    disk:
      name: gestion-locative-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/cite_manager.db
      - key: SECRET_KEY
        generateValue: true
      - key: MOT_DE_PASSE_ADMIN
        sync: false
      - key: APP_BASE_URL
        sync: false
