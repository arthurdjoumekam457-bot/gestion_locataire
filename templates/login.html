{% extends "base.html" %}
{% block titre %}Connexion Administrateur{% endblock %}

{% block contenu %}
<div class="max-w-sm mx-auto bg-white rounded-lg shadow p-6 mt-10">
    <h1 class="text-xl font-bold text-emerald-800 mb-4 text-center">Connexion Administrateur</h1>
    <form method="POST" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
            <input type="password" name="mot_de_passe" required autofocus
                   class="w-full border border-gray-300 rounded px-3 py-2 focus:ring-emerald-500 focus:border-emerald-500">
        </div>
        <button type="submit"
                class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700">
            Se connecter
        </button>
    </form>
</div>
{% endblock %}
