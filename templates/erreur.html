{% extends "base.html" %}
{% block titre %}Erreur {{ code }}{% endblock %}
{% block contenu %}
<div class="max-w-xl mx-auto rounded-3xl bg-white p-10 text-center shadow-lg">
    <p class="text-5xl font-black text-emerald-700">{{ code }}</p>
    <h1 class="mt-4 text-2xl font-bold text-slate-800">Une difficulté est survenue</h1>
    <p class="mt-3 text-slate-600">{{ message }}</p>
    <a href="{{ url_for('accueil') }}" class="mt-6 inline-block rounded-full bg-emerald-700 px-5 py-3 font-semibold text-white">Retour à l’accueil</a>
</div>
{% endblock %}
